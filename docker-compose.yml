services:
  nodejs:
    build:
      context: .
      dockerfile: Dockerfile
    image: nodejs
    container_name: gda_nodejs
    restart: always
    init: true
    stop_grace_period: 25s
    env_file: .env
    environment:
      - NODE_ENV=production
      - DB_USERNAME=$DB_USERNAME
      - DB_PASSWORD=$DB_PASSWORD
      - DB_HOST=db
      - DB_PORT=$DB_PORT
      - DB_NAME=$DB_NAME
      - SMTP_HOST=$SMTP_HOST
      - SMTP_PORT=$SMTP_PORT
      - SMTP_USER=$SMTP_USER
      - SMTP_PASS=$SMTP_PASS
      - DRAGONFLY_URL=redis://dragonfly:6379
    depends_on:
      db:
        condition: service_healthy
      # Dragonfly is an optimization, never a hard dependency: the application
      # is fail-open, so only require the container to have started, not to be
      # healthy. A cache outage must not block the origin from serving.
      dragonfly:
        condition: service_started
    ports:
      - "8080:3000"
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.35.1
    container_name: gda_dragonfly
    restart: unless-stopped
    command:
      - --cache_mode=true
      - --maxmemory=1gb
      - --proactor_threads=1
      - --primary_port_http_enabled=false
      - --version_check=false
    # memlock=-1 (unlimited locked memory) is a Dragonfly performance
    # optimization, not required to run. Some container runtimes refuse to set
    # it ("error setting rlimit type 8: operation not permitted"), so it is
    # disabled for portability. Re-enable only on hosts that permit it:
    # ulimits:
    #   memlock: -1
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: mongo:5.0.5
    container_name: gda_db
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=$DB_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD=$DB_PASSWORD
    volumes:
      - dbdata:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
